# Name That LLM — Qwen3 + learnable probes, tiered LoRA, multi-layer head.
# Qwen3-0.6B-Base and Qwen3-1.7B share this 28-block map. 4B/8B have 36 blocks,
# 14B has 40, 32B has 64; retarget tap_layers and lora.*.layers for those.

model_id: Qwen/Qwen3-0.6B-Base
# model_id: Qwen/Qwen3-8B-Base
hf_cache: ../hf_cache
max_len: 512
# 1-indexed blocks. Qwen3-0.6B-Base has 28, all full attention.
tap_layers: [4, 8, 12, 16, 20, 24, 28]
# tap_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36]

probe:
  probe_count: 10  # learnable tokens appended after passage (fixed order)
  freeze: false
  lr: 5.0e-4

head:
  freeze: false
  lr: 2.0e-4
  dropout: 0.1

contrast:
  weight: 0.3  # 0 disables supervised contrastive on contrast head output
  temperature: 0.7
  hidden_dim: 24
  out_dim: 32
  freeze: false
  lr: 1.0e-4

lora:
  lora_1:
    enabled: false
    layers: [1, 2, 3, 4, 5, 6, 7]
    r: 2
    alpha: 4
    dropout: 0.05
    lr: 1.0e-6
  lora_2:
    enabled: false
    layers: [8, 9, 10, 11, 12, 13, 14]
    r: 2
    alpha: 4
    dropout: 0.05
    lr: 1.0e-6
  lora_3:
    enabled: false
    layers: [15, 16, 17, 18, 19, 20, 21]
    r: 2
    alpha: 4
    dropout: 0.05
    lr: 1.0e-6
  lora_4:
    enabled: false
    layers: [22, 23, 24, 25, 26, 27, 28]
    r: 2
    alpha: 4
    dropout: 0.05
    lr: 1.0e-6

data:
  root: data
  train_csv: train.csv
  test_fraction: 0.1  # 0 trains on every complete prompt
  seed: 42
  num_workers: 0

train:
  checkpoint:
    init:
    resume: true
  session_dir: training_session
  epochs: 100
  batch_size: 8
  prompt_count: 2  # authors per batch = batch_size / prompt_count
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  max_steps: 0
  save_steps: 50
  optimizer:
    betas: [0.9, 0.999]
    eps: 1.0e-8
