[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma-author-probe"
version = "0.1.22"
description = "Frozen Gemma 3 270M + learnable probe token, 18-class authorship head"
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.26.0",
  "pyyaml>=6.0.2",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "tqdm>=4.66.0",
  "transformers>=4.55.0",
]

[project.scripts]
gemma-author-probe = "cli:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"
"labels.py" = "labels.py"
"data.py" = "data.py"
"model.py" = "model.py"
"loss.py" = "loss.py"
"device.py" = "device.py"
"env.py" = "env.py"
"train.py" = "train.py"
"preview.py" = "preview.py"
"run_test.py" = "run_test.py"

[tool.uv]
package = true
