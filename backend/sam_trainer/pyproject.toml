[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam-trainer"
version = "0.1.0"
description = "SAM 2.1 point-prompt room segmentation for floor plans"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0.0",
  "dataset-manager",
  "datasets>=3.0.0",
  "huggingface_hub>=0.26.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "shapely>=2.0.6",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.48.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[project.scripts]
sam-train = "sam_cli:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"sam_cli.py" = "sam_cli.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"
"canvas.py" = "canvas.py"
"data.py" = "data.py"
"model.py" = "model.py"
"preview.py" = "preview.py"
"train.py" = "train.py"

[tool.uv]
package = true
