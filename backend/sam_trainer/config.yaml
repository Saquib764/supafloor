model_id: facebook/sam2.1-hiera-small
canvas_size: 1024
hf_cache: ../hf_cache

data:
  dataset: floorplan-manual
  revision: null
  seed: 42
  test_fraction: 0.2
  room_slots: 1
  per_room_variation: 1
  point_distance_alpha: 1.5
  num_workers: 0

finetune:
  neck: true
  prompt_encoder: false
  mask_decoder: true

lora:
  rank: 8
  dropout: 0.05
  stage3: true
  stage4: true

train:
  session_dir: training_session_2
  from_checkpoint: training_session/checkpoint-2000
  epochs: 150
  batch_size: 1
  grad_accum: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.01
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_steps: 1000
  resume: false
  fp16: true
  viz_steps: 100
  viz_samples: 6

infer:
  multimask_output: false
  checkpoint: training_session_2/checkpoint-1000
