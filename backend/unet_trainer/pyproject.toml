[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unet-trainer"
version = "0.1.0"
description = "ViT bottleneck in taef2 latent space: floor-plan image → simple_image"
requires-python = ">=3.11"
dependencies = [
  "dataset-manager",
  "datasets>=3.0.0",
  "huggingface_hub>=0.26.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "torch>=2.4.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[project.scripts]
unet-train = "unet_cli:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"unet_cli.py" = "unet_cli.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"
"data.py" = "data.py"
"model.py" = "model.py"
"preview.py" = "preview.py"
"taesd.py" = "taesd.py"
"train.py" = "train.py"

[tool.uv]
package = true
