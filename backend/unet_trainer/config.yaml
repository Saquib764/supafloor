hf_cache: ../hf_cache
image_size: 768

data:
  dataset: floorplan-vae
  seed: 42

taesd:
  encoder: ../hf_cache/taesd/taef2_encoder.pth
  decoder: ../hf_cache/taesd/taef2_decoder.pth

vit:
  dim: 96
  depth: 4
  heads: 6
  mlp_ratio: 4
  patch_size: 1

loss:
  ink_weight: 10.0

train:
  session_dir: training_session
  epochs: 10
  batch_size: 2
  grad_accum: 2
  learning_rate: 1.0e-4
  weight_decay: 0.0
  bf16: true
  resume: true
  save_steps: 1000
  recon_steps: 100
  max_grad_norm: 1.0
  num_workers: 0
  precompute_latent: true
