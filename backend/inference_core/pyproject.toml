[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-core"
version = "0.1.56"
description = "FPN floor plan structure mask inference and labeling tools"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0.0",
  "dataset-manager",
  "huggingface_hub>=0.26.0",
  "numpy>=1.26.0",
  "openai>=1.60.0",
  "paddleocr>=2.9.0",
  "paddlepaddle>=3.0.0",
  "python-dotenv>=1.0.0",
  "opencv-contrib-python-headless>=4.10.0",
  "peft>=0.13.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "replicate>=1.0.0",
  "safetensors>=0.4.0",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.48.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[dependency-groups]
dev = [
  "pygame>=2.6.0",
]

[project.scripts]
infer-image-edit = "infer_image_edit:main"
infer-fpn = "infer_fpn:main"
infer-ui-simple = "infer_ui_simple:main"
infer-ui-similar = "infer_ui_similar:main"
label-data = "label_data:main"

[tool.hatch.build.targets.wheel]
packages = ["util"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"infer_image_edit.py" = "infer_image_edit.py"
"infer_fpn.py" = "infer_fpn.py"
"infer_ui_simple.py" = "infer_ui_simple.py"
"infer_ui_similar.py" = "infer_ui_similar.py"
"label_data.py" = "label_data.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"

[tool.uv]
package = true
