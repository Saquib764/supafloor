[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-core"
version = "0.1.0"
description = "SAM mask-fit room polygon inference for floor plans"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0.0",
  "dataset-manager",
  "huggingface_hub>=0.26.0",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0",
  "peft>=0.13.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "safetensors>=0.4.0",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.48.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[project.scripts]
infer-sam-fit = "infer_sam_fit:main"

[tool.hatch.build.targets.wheel]
packages = ["util"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"infer_sam_fit.py" = "infer_sam_fit.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"

[tool.uv]
package = true
