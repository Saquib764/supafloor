hf_cache: ../hf_cache

model_id: Efficient-Large-Model/Sana_600M_1024px_diffusers
variant: fp16
revision: null
resolution: 1024
max_sequence_length: 300
complex_human_instruction: null

data:
  dataset: diffusers/dog-example
  split: train
  image_column: image
  caption_column: prompt
  revision: null
  seed: 42
  center_crop: false
  random_flip: true

lora:
  rank: 4
  alpha: 4
  dropout: 0.0
  target_modules:
    - to_k
    - to_q
    - to_v

train:
  full_finetune: false
  session_dir: training_session
  epochs: 1
  batch_size: 1
  grad_accum: 4
  learning_rate: 1.0e-4
  lr_scheduler: constant_with_warmup
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  weighting_scheme: none
  save_steps: 500
  resume: false
  from_adapter: null
  viz_steps: 100
  viz_prompts:
    - "a photo of sks dog in a pond"
  viz_seed: 42
  num_workers: 0

preview:
  prompt: "a photo of sks dog in a pond"
  seed: 42
