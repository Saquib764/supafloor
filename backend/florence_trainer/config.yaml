hf_cache: hf_cache

model_id: microsoft/Florence-2-base-ft
task_prompt: "<REFERRING_EXPRESSION_SEGMENTATION>"
image_size: 768
canvas_size: 1024
loc_bins: 1000

data:
  dataset: florence-rooms
  max_label_tokens: 256
  seed: 42

lora:
  dropout: 0.05
  vision_rank: 8
  encoder_rank: 8
  decoder_rank: 16

train:
  session_dir: training_session
  epochs: 10
  batch_size: 16
  grad_accum: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  save_steps: 2000
  test_infer_steps: 50
  max_grad_norm: 1.0
  test_infer_render: false
  resume: false

infer:
  num_points: 16
  max_new_tokens: 1024
  num_beams: 3
  seed: null
