hf_cache: ../hf_cache

model_id: microsoft/Florence-2-base
image_size: 768
canvas_size: 1024
loc_bins: 1000

data:
  dataset: florence-rooms
  max_label_tokens: 512
  empty_polygon_prob: 0.05
  excluded_point_prob: 0.1
  inside_counts: [1, 1, 1, 1, 1, 2, 2, 2, 3, 4]
  excluded_counts: [1, 1, 2, 2, 3, 4]
  room_slots: 3
  per_room_variation: 8
  seed: 42

lora:
  dropout: 0.05
  vision_rank: 8
  encoder_rank: 8
  decoder_rank: 16

train:
  session_dir: training_session
  epochs: 10
  batch_size: 24
  grad_accum: 2
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  save_steps: 2000
  max_grad_norm: 1.0
  resume: false
  sample_region_size_path: sample_region_size.txt
  sample_region_refresh_steps: 100

infer:
  num_points: 16
  max_new_tokens: 256
  num_beams: 3
  seed: null
