[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "florence-trainer"
version = "0.1.1"
description = "LoRA fine-tune Florence-2 to emit room polygons from floor-plan images"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0.0",
  "dataset-manager",
  "datasets>=3.0.0",
  "einops>=0.8.0",
  "hf-transfer>=0.1.9",
  "huggingface_hub>=0.26.0",
  "peft>=0.13.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "timm>=1.0.0",
  "torch>=2.4.0",
  "transformers>=4.45.0,<4.46.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[project.scripts]
florence-train = "florence_cli:main"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"florence_cli.py" = "florence_cli.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"
"data.py" = "data.py"
"infer.py" = "infer.py"
"preview.py" = "preview.py"
"loc.py" = "loc.py"
"model.py" = "model.py"
"plot.py" = "plot.py"
"train.py" = "train.py"
"test/fp1.jpg" = "test/fp1.jpg"
"test/fp2.jpg" = "test/fp2.jpg"
"test/fp3.jpg" = "test/fp3.jpg"

[tool.uv]
package = true
