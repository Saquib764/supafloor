# Step schedule: max label length (BOS…text…EOS) at each training step.
max_seq_len:
  - [0, 16]
  - [10000, 32]
  - [15000, 64]
  - [20000, 128]
  - [25000, 256]
  - [30000, 384]
  - [35000, 512]
  - [40000, 640]
  - [45000, 768]
  - [50000, 896]
  - [55000, 1024]
  - [60000, 1152]
  - [65000, 1280]
  - [70000, 1408]
  - [75000, 1536]

data:
  seed: 42
  # Step schedules: [[training_step, value], ...]. At step >= threshold, use that value.
  # First entry must be at step 0. Training step = optimizer steps (after grad accum).
  image_sizes:
    - [0, [[128, 128]]]
    - [10000, [[256, 128], [128, 256]]]
    - [20000, [[256, 128], [128, 256], [256, 256]]]
  paragraph_counts: [1, 2, 3]
  paragraph_len_min: 120
  paragraph_len_max: 400
  samples_per_epoch: 25000

words:
  path: renderer/words.json
  num_topics: 200
  words_per_topic: 100
  seed: 42

holdout:
  dir: holdout
  seed: 900001
  num_samples: 512
  image_size: [256, 256]
  paragraph_counts: [1, 2, 3]
  paragraph_len_min: 120
  paragraph_len_max: 400

train:
  session_dir: training_session
  epochs: 200
  batch_size: 4
  grad_accum: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
  resume: true
  save_steps: 1000
  viz_steps: 1000
  viz_samples: 4
  max_grad_norm: 1.0
  num_workers: 8  # parallel CPU render workers; 0 = main process only
  prefetch_factor: 2  # DataLoader batches prefetched per worker (num_workers > 0)
  prefetch_samples: 64  # in-process thread prefetch when num_workers = 0
  benchmark_steps: 5000  # holdout eval every N optimizer steps; 0 = off
  benchmark_batch_size: 32
  save_best: true

infer:
  checkpoint: training_session/last.pt
