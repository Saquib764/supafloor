max_seq_len: 128

data:
  seed: 42
  image_sizes:
    - [128, 128]
    # - [256, 128]
    # - [128, 256]
    # - [256, 256]
  sentence_len_min: 8
  sentence_len_max: 40
  # Number of text lines per sample — pick one value from this list each step.
  # Start [1]; add 2, 3, … once single-line OCR is stable.
  line_counts: [1]
  # Render variations (boolean). false = easy default; true = enable randomization.
  # Defaults: white canvas, black text, fixed printed font, top-left origin, even spacing.
  # Increase difficulty slowly — turn on one flag at a time, train, check viz/, then add the next.
  # Suggested order: font → font_size → x_offset → line_spacing → background → ink → grain → handwritten
  variations:
    background: false    # true: gray background (230–255). Impact: lighting/contrast shift.
    grain: false         # true: ±8 pixel noise. Impact: scan/photo artifacts; hardest visual noise.
    ink: false           # true: gray text instead of black. Impact: faded or light print.
    handwritten: false   # true: script/handwriting fonts. Impact: large glyph change; enable last.
    font: false          # true: random printed font per line. Impact: letter-shape diversity.
    font_size: false     # true: random size per line. Impact: scale/height cues change.
    x_offset: false      # true: random x per line. Impact: breaks fixed column alignment.
    line_spacing: false  # true: random line gap. Impact: vertical layout no longer uniform.
  samples_per_epoch: 10000

train:
  session_dir: training_session
  epochs: 20
  batch_size: 32
  grad_accum: 1
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
  resume: true
  save_steps: 1000
  viz_steps: 200
  viz_samples: 4
  max_grad_norm: 1.0
  num_workers: 0

infer:
  checkpoint: training_session/last.pt
