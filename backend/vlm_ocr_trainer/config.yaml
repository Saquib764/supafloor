# Step schedule: max label length (BOS…text…EOS) at each training step.
# Each value is [[length, weight], ...]; one length is sampled per batch (weights normalized to 1).
max_seq_len:
  - [0, [[8, 0.7], [16, 0.3]]]
  - [5000, [[8, 0.2], [16, 0.6], [32, 0.2]]]
  - [10000, [[16, 0.2], [32, 0.6], [64, 0.2]]]
  - [15000, [[32, 0.15], [64, 0.7], [128, 0.15]]]
  - [20000, [[64, 0.15], [128, 0.7], [256, 0.15]]]
  - [30000, [[128, 0.15], [256, 0.7], [384, 0.15]]]
  - [40000, [[256, 0.15], [384, 0.7], [512, 0.15]]]
  - [50000, [[384, 0.15], [512, 0.55], [768, 0.3]]]
  - [60000, [[512, 0.15], [768, 0.55], [1024, 0.3]]]
  - [75000, [[768, 0.15], [1024, 0.55], [1280, 0.3]]]
  - [90000, [[1024, 0.15], [1280, 0.55], [1536, 0.3]]]
  - [110000, [[1280, 0.15], [1536, 0.55], [1792, 0.3]]]
  - [130000, [[1536, 0.15], [1792, 0.55], [2048, 0.3]]]
  - [150000, [[1792, 0.15], [2048, 0.55], [2400, 0.3]]]
  # All lengths retained; weights ramp with size so long sequences stay primary.
  - [170000, [
      [8, 1], [16, 1], [32, 1], [64, 1], [128, 2],
      [256, 2], [384, 3], [512, 3], [768, 4],
      [1024, 5], [1280, 6], [1536, 7], [1792, 8], [2048, 9], [2400, 10],
    ]]

data:
  seed: 43
  # Step schedules: [[training_step, value], ...]. At step >= threshold, use that value.
  # First entry must be at step 0. Training step = optimizer steps (after grad accum).
  image_sizes:
    - [0, [[128, 128]]]
    - [20000, [[256, 256]]]
    - [50000, [[256, 256], [512, 256]]]
  paragraph_counts: [1, 2, 3]
  paragraph_len_max: 400
  # Each variation setting has its own [[step, value], ...] schedule (same format as max_seq_len).
  # Omit a key to keep the default from default_variation_settings() in config.py.
  variations:
    blur_prob:
      - [0, 0]
      - [9000, 0.2]
    bold_prob:
      - [0, 0]
      - [11000, 0.14]
    letter_spacing_prob:
      - [0, 0]
      - [13000, 0.55]
    rotation_prob:
      - [0, 0]
      - [15000, 0.5]
    italic_prob:
      - [0, 0]
      - [17000, 0.14]
    rotation_degrees:
      - [0, 0.0]
      - [15000, 0.5]
      - [20000, 1.0]
    font_size:
      - [0, [10, 12]]
      - [20000, [8, 16]]
    noise_prob:
      - [0, 0.2]
      - [21000, 0.85]
    antialias_prob:
      - [0, 0]
      - [25000, 0.35]
    jpeg_prob:
      - [0, 0]
      - [25000, 0.4]
    resize_prob:
      - [0, 0]
      - [30000, 0.45]
    research_prob:
      - [0, 0]
      - [35000, 0.12]
    handwritten_prob:
      - [0, 0]
      - [50000, 0.08]
  samples_per_epoch: 25000

words:
  path: renderer/words.json
  num_topics: 200
  words_per_topic: 100
  seed: 42

holdout:
  dir: holdout
  seed: 900001
  num_samples: 512
  image_size: [256, 256]
  paragraph_counts: [1, 2, 3]
  paragraph_len_max: 400

benchmark:
  max_seq_len: 384  # greedy decode cap on holdout (BOS…text…EOS)
  num_samples: 32 # omit = full holdout; e.g. 64 for a quick eval
  steps: 0  # holdout eval every N optimizer steps; 0 = off
  batch_size: 32
  save_best: true

train:
  session_dir: training_session
  epochs: 200
  batch_size: 8
  grad_accum: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
  resume: true
  save_steps: 1000
  viz_steps: 500
  viz_samples: 4
  max_grad_norm: 1.0
  num_workers: 8  # parallel CPU render workers; 0 = main process only
  prefetch_factor: 2  # DataLoader batches prefetched per worker (num_workers > 0)
  prefetch_samples: 64  # in-process thread prefetch when num_workers = 0

infer:
  checkpoint: training_session/last.pt
