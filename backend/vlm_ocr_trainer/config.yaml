# Step schedule: max label length (BOS…text…EOS) at each training step.
max_seq_len:
  - [0, 8]
  - [10000, 16]
  - [20000, 32]
  - [25000, 64]
  - [30000, 128]
  - [45000, 256]
  - [50000, 384]
  - [55000, 512]
  - [60000, 640]
  - [65000, 768]
  - [70000, 896]
  - [75000, 1024]
  - [80000, 1152]
  - [85000, 1280]
  - [90000, 1408]
  - [95000, 1536]

data:
  seed: 43
  # Step schedules: [[training_step, value], ...]. At step >= threshold, use that value.
  # First entry must be at step 0. Training step = optimizer steps (after grad accum).
  image_sizes:
    - [0, [[128, 128]]]
    - [20000, [[256, 256]]]
    - [50000, [[256, 256], [512, 256]]]
  paragraph_counts: [1, 2, 3]
  paragraph_len_max: 400
  # Each variation setting has its own [[step, value], ...] schedule (same format as max_seq_len).
  # Omit a key to keep the default from default_variation_settings() in config.py.
  variations:
    blur_prob:
      - [0, 0]
      - [9000, 0.2]
    bold_prob:
      - [0, 0]
      - [11000, 0.14]
    letter_spacing_prob:
      - [0, 0]
      - [13000, 0.55]
    rotation_prob:
      - [0, 0]
      - [15000, 0.5]
    italic_prob:
      - [0, 0]
      - [17000, 0.14]
    rotation_degrees:
      - [0, 0.0]
      - [15000, 0.5]
      - [20000, 1.0]
    font_size:
      - [0, [10, 12]]
      - [20000, [8, 16]]
    noise_prob:
      - [0, 0.2]
      - [21000, 0.85]
    antialias_prob:
      - [0, 0]
      - [25000, 0.35]
    jpeg_prob:
      - [0, 0]
      - [25000, 0.4]
    resize_prob:
      - [0, 0]
      - [30000, 0.45]
    research_prob:
      - [0, 0]
      - [35000, 0.12]
    handwritten_prob:
      - [0, 0]
      - [50000, 0.08]
  samples_per_epoch: 25000

words:
  path: renderer/words.json
  num_topics: 200
  words_per_topic: 100
  seed: 42

holdout:
  dir: holdout
  seed: 900001
  num_samples: 512
  image_size: [256, 256]
  paragraph_counts: [1, 2, 3]
  paragraph_len_max: 400

train:
  session_dir: training_session
  epochs: 200
  batch_size: 8
  grad_accum: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
  resume: true
  save_steps: 1000
  viz_steps: 500
  viz_samples: 4
  max_grad_norm: 1.0
  num_workers: 8  # parallel CPU render workers; 0 = main process only
  prefetch_factor: 2  # DataLoader batches prefetched per worker (num_workers > 0)
  prefetch_samples: 64  # in-process thread prefetch when num_workers = 0
  benchmark_steps: 1000  # holdout eval every N optimizer steps; 0 = off
  benchmark_batch_size: 32
  save_best: true

infer:
  checkpoint: training_session/last.pt
