# Step schedule: max label length (BOS…text…EOS) at each training step.
# Each value is [[length, weight], ...]; one length is sampled per batch (weights normalized to 1).
max_seq_len:
  - [0, [[8, 0.7], [16, 0.3]]]
  - [15000, [[8, 0.2], [16, 0.6], [32, 0.2]]]
  - [20000, [[16, 0.2], [32, 0.6], [64, 0.2]]]
  - [35000, [[32, 0.15], [64, 0.7], [128, 0.15]]]
  - [50000, [[64, 0.15], [128, 0.7], [256, 0.15]]]
  # - [30000, [[128, 0.15], [256, 0.7], [384, 0.15]]]
  # - [40000, [[256, 0.15], [384, 0.7], [512, 0.15]]]
  # - [50000, [[384, 0.15], [512, 0.55], [768, 0.3]]]
  # - [60000, [[512, 0.15], [768, 0.75], [1024, 0.1]]]

data:
  seed: 43
  # Step schedules: [[training_step, value], ...]. At step >= threshold, use that value.
  # First entry must be at step 0. Training step = optimizer steps (after grad accum).
  image_sizes:
    - [0, [[128, 128]]]
    - [70000, [[256, 128]]]
    - [90000, [[256, 128], [512, 128]]]
  max_text_len: 400
  # Each variation has its own [[step, value], ...] schedule. Omit a key → default in config.py.
  # Omitted defaults: contrast [35,120] ink=bg−rand; letter_spacing_max 1.8px;
  # line_gap [0.15,0.55]×font_size; blur_radius [0.25,0.9]; noise_sigma [1.0,5.0];
  # jpeg_quality [35,88]; topic_words_prob 0.85;
  # punct_after_content_prob 0.12; punct_before_content_prob 0.08; number_prob 0.28; continue_prob 0.65.
  variations:
    # Canvas fill gray level [min,max] 0–255; ink = bg − rand(contrast [35,120]).
    background:
      - [0, [230, 255]]
    # Text inset px per side; each side rand [min,max]: top, right, bottom, left.
    padding:
      - [0, [[2, 12], [2, 12], [2, 12], [2, 12]]]
    # P(apply Gaussian blur); radius uniform blur_radius [0.25, 0.9] px.
    blur_prob:
      - [0, 0.]
      - [9000, 0.2]
    # P(pick bold font from BOLD_FONT_PATHS).
    bold_prob:
      - [0, 0.]
      - [11000, 0.14]
    # P(add extra letter spacing); spacing uniform [0, letter_spacing_max 1.8] px.
    letter_spacing_prob:
      - [0, 0.2]
      - [13000, 0.55]
    # P(rotate image); angle uniform ±rotation_degrees.
    rotation_prob:
      - [0, 0.2]
      - [15000, 0.5]
    # P(pick italic font from ITALIC_FONT_PATHS).
    italic_prob:
      - [0, 0.2]
      - [17000, 0.14]
    # Max rotation angle (degrees); used when rotation_prob fires; fill = sampled background.
    rotation_degrees:
      - [0, 0.5]
      - [15000, 0.5]
      - [20000, 1.0]
    # Font size range [min,max] px.
    font_size:
      - [0, [8, 16]]
      - [20000, [8, 16]]
    # P(add Gaussian pixel noise); sigma uniform noise_sigma [1.0, 5.0].
    noise_prob:
      - [0, 0.3]
      - [21000, 0.55]
    # P(JPEG re-encode round-trip); quality uniform jpeg_quality [35, 88].
    jpeg_prob:
      - [0, 0.4]
      - [25000, 0.4]
    # P(insert citation-style research snippet after content token).
    research_prob:
      - [0, 0.3]
      - [35000, 0.12]
    # P(pick handwritten font from HANDWRITTEN_FONT_PATHS).
    handwritten_prob:
      - [0, 0.1]
      - [55000, 0.58]
  samples_per_epoch: 1000000

holdout:
  dir: holdout
  seed: 900001
  num_samples: 512
  image_size: [256, 256]
  max_text_len: 400

benchmark:
  max_seq_len: 384  # greedy decode cap on holdout (BOS…text…EOS)
  num_samples: 32 # omit = full holdout; e.g. 64 for a quick eval
  steps: 0  # holdout eval every N optimizer steps; 0 = off
  batch_size: 32
  save_best: true

train:
  session_dir: training_session
  init_checkpoint:  # weights from prior session; new optimizer/schedule
  epochs: 2
  batch_size: 64
  grad_accum: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
  resume: true
  save_steps: 1000
  viz_steps: 500
  viz_samples: 4
  max_grad_norm: 1.0
  num_workers: 8  # parallel CPU render workers; 0 = main process only
  prefetch_factor: 2  # DataLoader batches prefetched per worker (num_workers > 0)
  prefetch_samples: 64  # in-process thread prefetch when num_workers = 0

infer:
  checkpoint: training_session/last.pt
