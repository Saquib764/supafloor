# ModernBERT multi-option decision model (CLS score; segment markers)

hub:
  cache: ../hf_cache
  pretrained: answerdotai/ModernBERT-base

model:
  score_head:
    dropout: 0.1  # on CLS hidden before linear head (train only)

data:
  dataset: race
  source: local  # auto | local | hub
  race_subset: all  # all | middle | high
  train_split: train
  val_split: validation
  seed: 42
  num_workers: 0
  train_augment:
    shuffle_options: true
    omit_wrong_options: true

train:
  session_dir: training_session

  checkpoint:
    init: 
    resume: false
    save_steps: 500

  schedule:
    epochs: 1
    batch_size: 2
    variations: 2  # 1 gold + (variations - 1) wrong rows per example
    grad_accum: 1
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0
    bf16: false

  test_mode:
    enabled: false
    samples: 400

  eval:
    samples: 100
    steps: 500
    seed: 42

  learning_rates:
    head: 2.0e-3

  cls_embedding:
    train: false
    lr: 1.0e-5

  markers:
    state:     { train: true, lr: 1.0e-4 }
    question:  { train: true, lr: 1.0e-4 }
    options:   { train: true, lr: 1.0e-4 }
    candidate: { train: true, lr: 1.0e-4 }

  encoder:
    last_n_layers: 4  # 0 = frozen; N = last N blocks (+ final_norm when any train)
    layers:  # shallow → deep; length must equal last_n_layers
      - { train: false, lr: 1.0e-5 }
      - { train: false, lr: 2.0e-5 }
      - { train: false, lr: 5.0e-5 }
      - { train: true,  lr: 1.0e-4 }

infer:
  checkpoint: training_session/last
