# ModernBERT multi-option decision model (masked mean pool; [SEP] segment boundaries)

hub:
  cache: ../hf_cache
  pretrained: answerdotai/ModernBERT-large

model:
  max_len: 1640  # cap <= encoder max_position_embeddings; truncate context first, then head
  score_head:
    token: mask  # mask | cls — gather encoder hidden at this token per option
    dropout: 0.0  # on gathered hiddens before decision stack (train only)
    hidden_size: 1024  # LayerNorm → Linear → GELU → Linear → 1 per option
  decision_layers:
    count: 2  # transformer layers over option hiddens [B, K, H]
    hidden_size: 1024
    num_attention_heads: 16
    intermediate_size: 4096  # FFN width
    pre_norm: true
    dropout: 0.1

data:
  dataset: race  # race | mnli (dataset_manager registry)
  source: local  # auto | local | hub
  race_subset: all  # RACE only: all | middle | high
  train_split: train
  val_split: validation_matched  # mnli: validation_matched | validation_mismatched; race: validation
  seed: 42
  num_workers: 0

train:
  session_dir: training_session

  checkpoint:
    init: 
    resume: true
    save_steps: 500

  schedule:
    epochs: 10
    batch_size: 2
    grad_accum: 1
    warmup_ratio: 0.05
    weight_decay: 0.0
    max_grad_norm: 1.0
    bf16: false

  # AdamW only (decoupled weight decay; pairs well with soft-target CE + warmup/cosine).
  optimizer:
    betas: [0.9, 0.999]
    eps: 1.0e-8

  # Quick training run on a fixed subset (not the full train split). First run writes
  # {session_dir}/test_train_samples.jsonl; later runs reuse it. Change samples or
  # resample with --test-refresh on the CLI.
  test_mode:
    enabled: true
    samples: 30  # e.g. 100 or 200

  eval:
    samples: 20
    steps: 500
    seed: 42

  head:
    lr: 2.0e-3  # linear score head

  encoder:
    last_n_layers: 4  # 0 = frozen; N = last N blocks (+ final_norm when any train)
    layers:  # shallow → deep; length must equal last_n_layers
      - { train: false, lr: 1.0e-5 }
      - { train: false, lr: 2.0e-5 }
      - { train: false, lr: 5.0e-5 }
      - { train: false,  lr: 1.0e-4 }

infer:
  checkpoint: training_session/last
