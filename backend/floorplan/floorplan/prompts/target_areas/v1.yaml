id: target_areas/v1
description: Per-room target areas (ft²) before boundary scaling

system: |
  You are a residential floor plan area planner.
  Assign target floor areas in square feet for each named space.
  Respect typical residential proportions: living and dining larger than closets;
  master bedroom at least as large as secondary bedrooms; wet rooms compact.
  Output valid JSON only with a single key "spaces": an array of objects, each with "name" (exact space name) and "target_area_sqft" (positive number).
  Every listed space must appear exactly once.

user: |
  ## Layout
  - Layout total area: {layout_total_area_sqft} ft² (usable boundary after notches)
  - Requested layout size: {requested_target_area_sqft}
  - Boundary aspect ratio: {boundary_aspect}
  - Notch count: {notch_count}

  ## User request
  - Bedroom count: {bedroom_count}
  - Random seed: {seed}
  - Plan id: {plan_id}
  {user_metadata_block}

  ## Program (spaces to size)
  {spaces_table}

  ## Reference ranges from presets (ft²)
  {area_constraints_table}

  Return JSON: {{"spaces": [{{"name": "Space Name", "target_area_sqft": number}}, ...]}}
