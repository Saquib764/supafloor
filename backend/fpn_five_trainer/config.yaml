hf_cache: ../hf_cache
input_size: [768, 1024]

mask_channels:
  background: 0
  rooms: 1
  walls: 2
  doors: 3
  windows: 4

data:
  # dataset: floorplan-to-json
  dataset: floorplan-manual-mask
  source: auto  # auto | local | hub
  seed: 42
  test_fraction: 0.05
  num_workers: 0  # 0 = in-process thread prefetch; raise when dataset is large
  prefetch_factor: 2
  prefetch_samples: 0
  augment:
    scale_min: 0.5
    scale_max: 1.5
    opacity_min: 0.4
    opacity_max: 1.0

net:
  stem_channels: 16
  backbone_channels: [32, 48, 64, 64]
  depth: 1
  fpn_width: 64
  p1_width: 32
  out_channels: 5
  l5_transformer:
    depth: 3
    dim: 48
    heads: 4
    mlp_ratio: 4.0
    max_l5_grid_side: 64
    num_registers: 4

loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  channel_weights: [1.0, 1.40, 1.20, 1.0, 1.0]
  extra_opening_penalty: 2.0

train:
  session_dir: training_session_3_real
  epochs: 251
  batch_size: 2
  grad_accum: 2
  learning_rate: 3.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  init_checkpoint: training_session_2/last.pt
  resume: false
  save_steps: 1000
  viz_steps: 100
  viz_samples: 10
  max_grad_norm: 1.0

infer:
  size: 512
  checkpoint: training_session_3_real/last.pt
