[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpn-five-trainer"
version = "0.1.11"
description = "Floor-plan five-class segmentation via CNN + FPN"
requires-python = ">=3.11"
dependencies = [
  "dataset-manager",
  "datasets>=3.0.0",
  "huggingface_hub>=0.26.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
  "shapely>=2.0.6",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66.0",
]

[tool.uv.sources]
dataset-manager = { path = "../../dataset_manager", editable = true }

[project.scripts]
fpn-train = "fpn_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["net"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"fpn_cli.py" = "fpn_cli.py"
"config.py" = "config.py"
"config.yaml" = "config.yaml"
"data.py" = "data.py"
"canvas.py" = "canvas.py"
"device.py" = "device.py"
"train.py" = "train.py"
"preview.py" = "preview.py"
"infer.py" = "infer.py"

[tool.uv]
package = true
